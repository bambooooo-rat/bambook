<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成績紀錄與數據分析</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --surface: #fffdfa;
      --surface-soft: #efede5;
      --text: #1f2421;
      --muted: #6f766f;
      --muted-2: #92998f;
      --border: #d8d2c4;
      --border-soft: #e7e1d5;
      --accent: #3f7f68;
      --accent-strong: #2f6652;
      --accent-soft: #e2eee8;
      --warn: #a16207;
      --danger: #b42318;
      --mono: ui-monospace, SFMono-Regular, Consolas, "Noto Sans Mono", monospace;
      --sans: "Noto Sans TC", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sidebar-w: 17rem;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.62;
      -webkit-user-select: none;
      user-select: none;
    }
    input, select, button, textarea { font: inherit; }
    input, select, textarea, table, canvas { -webkit-user-select: text; user-select: text; }
    button, a { color: inherit; }
    a { text-decoration: none; }
    .hidden, [hidden] { display: none !important; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 82%, var(--surface));
    }
    .brand { padding: 1.25rem 1.2rem 1rem; border-bottom: 1px solid var(--border-soft); }
    .brand-title { margin: 0; font-size: 1.05rem; font-weight: 820; letter-spacing: -0.025em; line-height: 1.25; }
    .brand-caption { margin: .25rem 0 0; color: var(--muted); font-family: var(--mono); font-size: .72rem; line-height: 1.4; }
    .nav { min-height: 0; overflow: auto; padding: .8rem .7rem; }
    .nav-section-title { margin: 1rem .55rem .45rem; color: var(--muted-2); font-family: var(--mono); font-size: .68rem; font-weight: 780; letter-spacing: .05em; }
    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .65rem;
      min-height: 2.35rem;
      margin: .08rem 0;
      padding: .45rem .55rem;
      border-radius: 8px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 680;
      transition: background .14s ease, color .14s ease;
    }
    .nav-link:hover, .nav-link.is-active { background: var(--accent-soft); color: var(--accent-strong); }
    .nav-link small { color: var(--muted-2); font-family: var(--mono); font-size: .68rem; font-weight: 700; }
    .sidebar-foot { padding: .75rem 1.2rem 1rem; border-top: 1px solid var(--border-soft); color: var(--muted-2); font-family: var(--mono); font-size: .68rem; }
    .main { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.25rem;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }
    .page-title { margin: 0; font-size: 1.08rem; font-weight: 820; letter-spacing: -0.02em; line-height: 1.2; }
    .topbar-meta { display: flex; align-items: center; gap: .65rem; color: var(--muted); font-family: var(--mono); font-size: .72rem; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      min-height: 2.1rem;
      padding: 0 .7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 760;
      line-height: 1;
    }
    .button:hover { border-color: var(--accent); color: var(--accent-strong); }
    .content { width: min(1180px, calc(100% - 4rem)); margin: 0 auto; padding: 2rem 0 3rem; }
    .view { display: grid; gap: 1.65rem; }
    .section { padding: 0 0 1.45rem; border-bottom: 1px solid var(--border); }
    .section:last-child { border-bottom: 0; }
    .section-header { display: flex; align-items: end; justify-content: space-between; gap: 1.2rem; margin-bottom: .95rem; }
    .section-title { margin: 0; font-size: 1.15rem; font-weight: 820; letter-spacing: -0.025em; line-height: 1.25; }
    .section-caption { margin: .22rem 0 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .metric { min-width: 0; padding: 1rem .95rem; border-right: 1px solid var(--border-soft); }
    .metric:last-child { border-right: 0; }
    .metric-label { margin: 0 0 .35rem; color: var(--muted); font-family: var(--mono); font-size: .72rem; font-weight: 760; line-height: 1.35; }
    .metric-value { margin: 0; font-family: var(--mono); font-size: clamp(1.55rem, 3vw, 2.2rem); font-weight: 860; letter-spacing: -0.04em; line-height: 1; }
    .metric-sub { margin: .35rem 0 0; color: var(--muted-2); font-family: var(--mono); font-size: .7rem; line-height: 1.35; }
    .progress-list { display: grid; gap: .15rem; }
    .progress-row {
      display: grid;
      grid-template-columns: minmax(10rem, 1fr) 7rem minmax(12rem, 1.25fr) 4rem;
      align-items: center;
      gap: .85rem;
      padding: .72rem 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .progress-row:last-child { border-bottom: 0; }
    .progress-name { min-width: 0; font-weight: 760; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress-number, .progress-percent { color: var(--muted); font-family: var(--mono); font-size: .78rem; text-align: right; white-space: nowrap; }
    .progress-track { height: .55rem; border-radius: 999px; background: var(--surface-soft); overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); display: flex; justify-content: flex-end; }
    .progress-pending { height: 100%; background: color-mix(in srgb, var(--accent) 35%, var(--surface-soft)); }
    .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem 1.35rem; }
    .chart-panel { min-width: 0; padding: 0; background: transparent; }
    .chart-frame { height: 320px; padding: .6rem 0 0; border-top: 1px solid var(--border-soft); }
    .filter-bar { display: grid; grid-template-columns: repeat(5, minmax(8rem, 1fr)); gap: .65rem; padding: .8rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .field { display: grid; gap: .28rem; }
    .field label { color: var(--muted); font-family: var(--mono); font-size: .68rem; font-weight: 760; }
    .field input, .field select {
      width: 100%;
      min-height: 2.1rem;
      padding: 0 .55rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: 0;
      font-size: .84rem;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    .table-wrap { width: 100%; overflow: auto; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; line-height: 1.45; }
    th, td { padding: .62rem .65rem; border-bottom: 1px solid var(--border-soft); vertical-align: middle; text-align: left; }
    th { position: sticky; top: 0; z-index: 1; background: var(--bg); color: var(--muted); font-family: var(--mono); font-size: .68rem; font-weight: 780; letter-spacing: .035em; white-space: nowrap; }
    tbody tr:hover { background: color-mix(in srgb, var(--surface-soft) 56%, transparent); }
    td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
    td.center, th.center { text-align: center; }
    .course-name { min-width: 14rem; font-weight: 680; }
    .mono { font-family: var(--mono); }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.3rem;
      min-height: 1.45rem;
      padding: .05rem .38rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 760;
      line-height: 1;
      white-space: nowrap;
    }
    .badge--a { background: #e5f3eb; color: #24694d; border-color: #c8e2d2; }
    .badge--b { background: #e8eee7; color: #4d6654; border-color: #d3ded2; }
    .badge--c { background: #f4edda; color: #805d16; border-color: #e5d5aa; }
    .badge--fail { background: #f8e4e2; color: var(--danger); border-color: #e9c2bd; }
    .badge--neutral { background: var(--surface-soft); color: var(--muted); border-color: var(--border); }
    .audit-tags { display: flex; flex-wrap: wrap; gap: .25rem; min-width: 12rem; }
    .audit-tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.35rem;
      padding: 0 .36rem;
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .66rem;
      line-height: 1;
      white-space: nowrap;
    }
    .audit-tag[data-status="applied"] { border-color: #c8e2d2; color: #2f6652; background: #edf7f1; }
    .audit-tag[data-status="exempted"] { border-color: #c2dbe4; color: #17606d; background: #edf7f9; }
    .audit-tag[data-status="cross"] { border-color: #d8cfb8; color: #765c20; background: #f6f1e5; }
    .audit-tag[data-status="overflow"] { border-color: #e3d3a4; color: #875c08; background: #fbf4d8; }
    .audit-table {
      margin-top: .75rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .audit-table-head,
    .audit-summary {
      display: grid;
      grid-template-columns: 1rem minmax(12rem, 1fr) 8rem minmax(12rem, 1.15fr) 4rem;
      align-items: center;
      gap: .75rem;
    }
    .audit-table-head {
      min-height: 2.35rem;
      border-bottom: 1px solid var(--border-soft);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 780;
      letter-spacing: .035em;
    }
    details.audit-category {
      border-bottom: 1px solid var(--border-soft);
    }
    details.audit-category:last-child { border-bottom: 0; }
    .audit-summary {
      min-height: 3.05rem;
      cursor: pointer;
      list-style: none;
      transition: background .14s ease;
    }
    .audit-summary:hover { background: color-mix(in srgb, var(--surface-soft) 45%, transparent); }
    .audit-summary::-webkit-details-marker { display: none; }
    .audit-summary::before {
      content: "▸";
      color: var(--muted);
      font-size: .78rem;
      transform: translateX(.15rem);
    }
    details[open] > .audit-summary::before { content: "▾"; }
    .audit-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 780;
    }
    .audit-credit,
    .audit-percent {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .78rem;
      text-align: right;
      white-space: nowrap;
    }
    .audit-detail {
      padding: .2rem 0 1rem 1.75rem;
    }
    .sub-audit {
      margin: .8rem 0 1.05rem;
      padding-left: .8rem;
      border-left: 2px solid var(--border-soft);
    }
    .sub-audit-title {
      display: flex;
      justify-content: space-between;
      gap: .7rem;
      margin-bottom: .45rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 760;
    }
    .table-wrap--nested {
      border-top-color: var(--border-soft);
      border-bottom-color: var(--border-soft);
    }
    .table-wrap--nested table { font-size: .8rem; }
    .table-wrap--nested th { background: var(--surface); }
    .status-line { color: var(--muted); font-size: .76rem; line-height: 1.45; }
    .empty { margin: 0; color: var(--muted-2); font-size: .82rem; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .78rem;
    }

    th .button {
      min-height: 1.45rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }
    th .button:hover { color: var(--accent-strong); background: transparent; }
    .chart-panel .section-caption { margin: 0 0 .35rem; font-family: var(--mono); font-size: .72rem; }
    .section-header .section-caption { text-align: right; }
    .error-box {
      width: min(42rem, calc(100% - 2rem));
      padding: 1rem;
      border: 1px solid var(--danger);
      border-radius: 10px;
      background: color-mix(in srgb, var(--danger) 7%, var(--surface));
      color: var(--danger);
      font-family: var(--mono);
      font-size: .84rem;
      line-height: 1.6;
    }
    @media (max-width: 1060px) {
      :root { --sidebar-w: 14.5rem; }
      .content { width: min(100% - 2rem, 1180px); }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--border-soft); }
      .chart-grid { grid-template-columns: 1fr; }
      .filter-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .progress-row { grid-template-columns: minmax(8rem, 1fr) 6rem minmax(9rem, 1fr) 3.5rem; }
    }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { padding: 1rem; }
      .nav { display: flex; gap: .35rem; overflow-x: auto; padding: .65rem 1rem; }
      .nav-section-title, .sidebar-foot { display: none; }
      .nav-link { flex: 0 0 auto; margin: 0; }
      .nav-link small { display: none; }
      .topbar { padding: 0 1rem; }
      .content { width: min(100% - 1.5rem, 1180px); padding-top: 1.25rem; }
      .metric-grid, .filter-bar { grid-template-columns: 1fr; }
      .metric { border-right: 0; border-bottom: 1px solid var(--border-soft); }
      .metric:last-child { border-bottom: 0; }
      .progress-row { grid-template-columns: 1fr; gap: .35rem; padding: .75rem 0; }
      .audit-table-head { display: none; }
      .audit-summary { grid-template-columns: 1rem minmax(0, 1fr) auto; gap: .45rem; padding: .75rem 0; }
      .audit-summary .progress-track { grid-column: 2 / -1; }
      .audit-detail { padding-left: 0; }
      .audit-percent { text-align: right; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading courses.json / program.json</div>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <header class="brand">
        <h1 class="brand-title">成績紀錄與數據分析</h1>
        <p class="brand-caption">Transcript Analytics</p>
      </header>
      <nav id="nav" class="nav" aria-label="頁面導覽">
        <p class="nav-section-title">Views</p>
        <a class="nav-link" href="#overview" data-route="overview">總覽 <small>Overview</small></a>
        <a class="nav-link" href="#courses" data-route="courses">課程資料 <small>Courses</small></a>
        <a class="nav-link" href="#analytics" data-route="analytics">統計分析 <small>Analytics</small></a>
        <div id="program-nav"></div>
      </nav>
      <footer class="sidebar-foot" id="data-foot">No data</footer>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 class="page-title" id="page-title">總覽</h2>
        <div class="topbar-meta">
          <span id="data-status">Ready</span>
          <button type="button" class="button" id="refresh-btn">Reload</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <script>
let coursesData = [];
    let rulesData = null;
    let generatedReports = {};
    let currentSort = { key: "semester", direction: "desc" };
    let activeFilters = { search: "", semester: "all", grade: "all", pass: "all", program: "all" };
    let charts = {};

    const palette = {
      accent: "#3f7f68",
      accentStrong: "#2f6652",
      border: "#d8d2c4",
      muted: "#6f766f",
      text: "#1f2421",
      soft: "#efede5",
      domain: ["#3f7f68", "#8a7a3f", "#6e8273", "#9a6b4f", "#a8a29a", "#5f7568"],
      grade: {
        "A+": "#2f6652", "A": "#3f7f68", "A-": "#5a947d",
        "B+": "#7b8f68", "B": "#8fa06e", "B-": "#a6a970",
        "C+": "#b8944d", "C": "#b07842", "C-": "#a55d3d",
        "D": "#b45309", "D*": "#b42318", "E": "#b42318", "E*": "#b42318",
        "F": "#b42318", "X": "#b42318", "Q": "#8b5a5a", "W": "#8b5a5a",
        "P": "#6e8273", "採": "#6e8273", "未登": "#a8a29a"
      }
    };

    const pageTitles = { overview: "總覽", courses: "課程資料", analytics: "統計分析" };
    const isPassed = grade => !["E", "E*", "F", "X", "Q", "W", "D*"].includes(grade);

    const getGpaPoints = grade => ({
      "A+": 4.3, "A": 4.0, "A-": 3.7,
      "B+": 3.3, "B": 3.0, "B-": 2.7,
      "C+": 2.3, "C": 2.0, "C-": 1.7,
      "D": 1.0, "D*": 1.0, "E": 0.0, "E*": 0.0, "F": 0.0, "X": 0.0
    }[grade]);

    const getCourseCode = course => course.course_code || course.code || "";
    const fmt = value => Number(value || 0).toFixed(1).replace(/\.0$/, "");
    const pct = (current, max) => max > 0 ? Math.min(100, (current / max) * 100) : 0;
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));

    const getGradeClass = grade => {
      if (["A+", "A", "A-"].includes(grade)) return "badge--a";
      if (["B+", "B", "B-"].includes(grade)) return "badge--b";
      if (["C+", "C", "C-", "D"].includes(grade)) return "badge--c";
      if (["E", "E*", "F", "X", "Q", "W", "D*"].includes(grade)) return "badge--fail";
      return "badge--neutral";
    };

    const getGradeTag = grade => `<span class="badge ${getGradeClass(grade)}">${escapeHTML(grade || "-")}</span>`;
    const getStatusLabel = status => ({ applied: "採計", exempted: "抵免", cross: "跨域", overflow: "超額" }[status] || status);
    const getStatusBadge = status => `<span class="audit-tag" data-status="${escapeHTML(status)}">${escapeHTML(getStatusLabel(status))}</span>`;

    function matchRuleBodyOnly(course, rule) {
      if (!rule) return false;
      const code = getCourseCode(course);
      if (rule.type === "regex") return new RegExp(rule.value).test(code);
      if (rule.type === "course_codes") return rule.values.includes(code);
      if (rule.type === "mixed") return rule.values.includes(code) || new RegExp(rule.regex).test(code);
      if (rule.type === "any") return true;
      return false;
    }

    function isCommonOrFreeCategory(categoryName) {
      return categoryName.includes("校共同") ||
             categoryName.includes("共同") ||
             categoryName.includes("通識") ||
             categoryName.includes("體育") ||
             categoryName.includes("自由");
    }

    function isCourseInSameProgramProfessionalCategory(course, report, currentCatNode) {
      if (!report || !report.categories) return false;
      return report.categories.some(catNode => {
        if (catNode === currentCatNode) return false;
        if (isCommonOrFreeCategory(catNode.name)) return false;
        if (catNode.subCategories && catNode.subCategories.length > 0) {
          return catNode.subCategories.some(subNode => matchRuleBodyOnly(course, subNode.match_rule));
        }
        return matchRuleBodyOnly(course, catNode.match_rule);
      });
    }

    function matchCourse(course, rule, context = {}) {
      if (!rule) return false;
      const code = getCourseCode(course);
      if (matchRuleBodyOnly(course, rule)) return true;
      if (rule.exemptions && rule.exemptions.some(e => e.taken === code)) return true;

      if (rule.cross_disciplinary && rule.cross_disciplinary.includes(code)) {
        return !isCourseInSameProgramProfessionalCategory(course, context.report, context.catNode);
      }
      return false;
    }

    function calculateOverallGPA() {
      let credits = 0;
      let points = 0;
      coursesData.forEach(course => {
        const p = getGpaPoints(course.grade);
        if (p !== undefined && Number(course.credits) > 0) {
          credits += Number(course.credits);
          points += p * Number(course.credits);
        }
      });
      return { value: credits > 0 ? points / credits : 0, credits };
    }

    function getSemesterStats() {
      const semesters = [...new Set(coursesData.map(c => c.semester))].sort();
      return semesters.map(semester => {
        const courses = coursesData.filter(c => c.semester === semester);
        const passed = courses.filter(c => isPassed(c.grade));
        const pending = courses.filter(c => c.grade === "未登");
        let gpaCredits = 0;
        let gpaPoints = 0;

        courses.forEach(course => {
          const p = getGpaPoints(course.grade);
          if (p !== undefined && Number(course.credits) > 0) {
            gpaCredits += Number(course.credits);
            gpaPoints += p * Number(course.credits);
          }
        });

        return {
          semester,
          totalCredits: courses.reduce((sum, c) => sum + Number(c.credits || 0), 0),
          earnedCredits: passed.filter(c => c.grade !== "未登").reduce((sum, c) => sum + Number(c.credits || 0), 0),
          pendingCredits: pending.reduce((sum, c) => sum + Number(c.credits || 0), 0),
          count: courses.length,
          gpaCredits,
          gpa: gpaCredits > 0 ? Number((gpaPoints / gpaCredits).toFixed(2)) : null,
        };
      });
    }

    function runGlobalAudit() {
      generatedReports = {};
      if (!rulesData || !coursesData) return;

      Object.keys(rulesData).forEach(programKey => {
        const programRule = rulesData[programKey];
        const report = {
          key: programKey,
          name: programRule.name,
          color: programRule.color || "default",
          year: programRule.applicable_year,
          totalRequired: 0,
          totalEarned: 0,
          totalPending: 0,
          categories: []
        };

        programRule.categories.forEach(cat => {
          const catNode = {
            name: cat.name,
            required: Number(cat.required_credits || 0),
            actualEarned: 0,
            pendingEarned: 0,
            earned: 0,
            pending: 0,
            items: [],
            subCategories: [],
          };

          if (cat.sub_categories) {
            cat.sub_categories.forEach(sub => {
              catNode.subCategories.push({
                name: sub.name,
                required: Number(sub.required_credits || 0),
                actualEarned: 0,
                pendingEarned: 0,
                earned: 0,
                pending: 0,
                items: [],
                match_rule: sub.match_rule,
              });
            });
          } else {
            catNode.match_rule = cat.match_rule;
          }

          report.categories.push(catNode);
          report.totalRequired += catNode.required;
        });

        generatedReports[programKey] = report;
      });

      coursesData.forEach(course => {
        course.matches = {};
        course.allocations = {};

        Object.keys(rulesData).forEach(programKey => {
          course.matches[programKey] = [];
          const report = generatedReports[programKey];

          report.categories.forEach((catNode, catIndex) => {
            if (catNode.subCategories.length > 0) {
              catNode.subCategories.forEach((subNode, subIndex) => {
                if (matchCourse(course, subNode.match_rule, { programKey, report, catNode, subNode })) {
                  course.matches[programKey].push({ catNode, subNode, catIndex, subIndex });
                }
              });
            } else if (matchCourse(course, catNode.match_rule, { programKey, report, catNode })) {
              course.matches[programKey].push({ catNode, subNode: null, catIndex });
            }
          });
        });
      });

      coursesData.forEach((course, courseIndex) => {
        if (!isPassed(course.grade)) return;
        const isPendingCourse = course.grade === "未登";

        Object.keys(rulesData).forEach(programKey => {
          const matches = course.matches[programKey];
          if (!matches || matches.length === 0) return;

          let selectedMatch = null;
          for (let i = 0; i < matches.length; i++) {
            const target = matches[i].subNode || matches[i].catNode;
            if ((target.actualEarned + target.pendingEarned) < target.required) {
              selectedMatch = matches[i];
              break;
            }
          }
          if (!selectedMatch) selectedMatch = matches[0];

          const target = selectedMatch.subNode || selectedMatch.catNode;
          const code = getCourseCode(course);
          let exemption = null;
          let isCross = false;

          if (target.match_rule) {
            if (target.match_rule.exemptions) exemption = target.match_rule.exemptions.find(e => e.taken === code);
            if (target.match_rule.cross_disciplinary && target.match_rule.cross_disciplinary.includes(code)) isCross = true;
          }

          const isOverflow = (target.actualEarned + target.pendingEarned) >= target.required;
          const status = isOverflow ? "overflow" : (exemption ? "exempted" : (isCross ? "cross" : "applied"));
          const reason = isOverflow ? "類別學分已滿" :
            (exemption ? `抵免科目: ${exemption.target} ${exemption.target_name || ""}`.trim() :
            (isCross ? "跨領域專業探索課程" : "採計"));

          if (isPendingCourse) target.pendingEarned += Number(course.credits || 0);
          else target.actualEarned += Number(course.credits || 0);

          target.items.push({ course, status, reason, courseIndex });
          course.allocations[programKey] = {
            programName: rulesData[programKey].name,
            category: selectedMatch.catNode.name,
            subCategory: selectedMatch.subNode ? selectedMatch.subNode.name : null,
            status,
            reason
          };
        });
      });

      Object.keys(generatedReports).forEach(programKey => {
        const report = generatedReports[programKey];
        report.categories.forEach(cat => {
          if (cat.subCategories.length > 0) {
            cat.subCategories.forEach(sub => {
              sub.earned = Math.min(sub.actualEarned, sub.required);
              sub.pending = Math.min(sub.pendingEarned, sub.required - sub.earned);
              cat.actualEarned += sub.actualEarned;
              cat.pendingEarned += sub.pendingEarned;
              cat.earned += sub.earned;
              cat.pending += sub.pending;
            });
          } else {
            cat.earned = Math.min(cat.actualEarned, cat.required);
            cat.pending = Math.min(cat.pendingEarned, cat.required - cat.earned);
          }
          report.totalEarned += cat.earned;
          report.totalPending += cat.pending;
        });
      });
    }

    function getCourseDomain(course) {
      if (!course.allocations || Object.keys(course.allocations).length === 0) return "自由選修/其他";
      const allocs = Object.values(course.allocations);
      if (allocs.some(a => a.category.includes("共同") || a.category.includes("通識") || a.category.includes("體育"))) {
        return "共同/通識";
      }
      const specialized = allocs.filter(a => !a.category.includes("自由"));
      if (specialized.length > 0) return specialized[0].programName;
      return "自由選修/其他";
    }

function getFilteredCourses() {
      const term = activeFilters.search.trim().toLowerCase();

      let filtered = coursesData.filter(course => {
        const matchesTerm = !term ||
          course.name.toLowerCase().includes(term) ||
          getCourseCode(course).toLowerCase().includes(term) ||
          String(course.teacher || "").toLowerCase().includes(term);

        const matchesSemester = activeFilters.semester === "all" || course.semester === activeFilters.semester;
        const matchesGrade = activeFilters.grade === "all" || course.grade === activeFilters.grade;
        const matchesPass = activeFilters.pass === "all" ||
          (activeFilters.pass === "passed" && isPassed(course.grade) && course.grade !== "未登") ||
          (activeFilters.pass === "pending" && course.grade === "未登") ||
          (activeFilters.pass === "failed" && !isPassed(course.grade));
        const matchesProgram = activeFilters.program === "all" ||
          (course.allocations && course.allocations[activeFilters.program]);

        return matchesTerm && matchesSemester && matchesGrade && matchesPass && matchesProgram;
      });

      filtered.sort((a, b) => {
        const modifier = currentSort.direction === "asc" ? 1 : -1;
        if (currentSort.key === "semester") return modifier * String(a.semester || "").localeCompare(String(b.semester || ""));
        if (currentSort.key === "code") return modifier * getCourseCode(a).localeCompare(getCourseCode(b));
        if (currentSort.key === "credits") return modifier * (Number(a.credits || 0) - Number(b.credits || 0));
        if (currentSort.key === "grade") {
          const rank = {
            "A+": 100, "A": 95, "A-": 90,
            "B+": 85, "B": 80, "B-": 75,
            "C+": 70, "C": 65, "C-": 60,
            "D": 50, "P": 45, "採": 44,
            "D*": 30, "E*": 20, "E": 18, "F": 15, "X": 10, "Q": 5, "W": 4, "未登": 0
          };
          return modifier * ((rank[a.grade] ?? -1) - (rank[b.grade] ?? -1));
        }
        return 0;
      });

      return filtered;
    }

                  <td class="num">${fmt(row.earnedCredits)}</td>
                  <td class="num">${fmt(row.pendingCredits)}</td>
                  <td class="num">${row.gpa === null ? "-" : row.gpa.toFixed(2)}</td>
                  <td class="num">${fmt(row.gpaCredits)}</td>
                  <td class="num">${row.count}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function destroyChart(id) {
      if (charts[id]) {
        charts[id].destroy();
        charts[id] = null;
      }
    }

    function createChart(id, config) {
      const el = document.getElementById(id);
      if (!el || !window.Chart) return;
      destroyChart(id);
      charts[id] = new Chart(el.getContext("2d"), config);
    }

    function defaultChartOptions(extra = {}) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 450 },
        plugins: {
          legend: {
            position: "bottom",
            labels: {
              boxWidth: 10,
              boxHeight: 10,
              color: palette.muted,
              font: { family: "Noto Sans TC, sans-serif", size: 11 }
            }
          },
          tooltip: {
            backgroundColor: "#1f2421",
            titleColor: "#fffdfa",
            bodyColor: "#fffdfa",
            padding: 10,
            displayColors: true,
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: palette.muted, font: { size: 11 } } },
          y: { beginAtZero: true, grid: { color: "#e7e1d5" }, ticks: { color: palette.muted, font: { size: 11 } } }
        },
        ...extra
      };
    }

    function renderSemesterCreditsChart() {
      const stats = getSemesterStats();
      createChart("semesterCreditsChart", {
        type: "bar",
        data: {
          labels: stats.map(s => s.semester),
          datasets: [
            {
              label: "修課學分",
              data: stats.map(s => s.totalCredits),
              backgroundColor: palette.accent,
              borderWidth: 0,
              borderRadius: 4,
            },
            {
              label: "未登學分",
              data: stats.map(s => s.pendingCredits),
              backgroundColor: "#a8a29a",
              borderWidth: 0,
              borderRadius: 4,
            }
          ]
        },
        options: defaultChartOptions()
      });
    }

    function renderSemesterGpaChart() {
      const stats = getSemesterStats();
      createChart("semesterGpaChart", {
        type: "line",
        data: {
          labels: stats.map(s => s.semester),
          datasets: [{
            label: "GPA",
            data: stats.map(s => s.gpa),
            borderColor: palette.accentStrong,
            backgroundColor: palette.accentStrong,
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: .28,
            spanGaps: true,
          }]
        },
        options: defaultChartOptions({
          scales: {
            x: { grid: { display: false }, ticks: { color: palette.muted, font: { size: 11 } } },
            y: {
              min: 0,
              max: 4.3,
              grid: { color: "#e7e1d5" },
              ticks: { color: palette.muted, font: { size: 11 } }
            }
          }
        })
      });
    }

    function renderGradeDistributionChart() {
      const order = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D", "D*", "E*", "E", "F", "X", "Q", "P", "採", "未登"];
      const counts = new Map();
      coursesData.forEach(course => counts.set(course.grade, (counts.get(course.grade) || 0) + 1));
      const labels = order.filter(g => counts.has(g));

      createChart("gradeDistributionChart", {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "門數",
            data: labels.map(g => counts.get(g)),
            backgroundColor: labels.map(g => palette.grade[g] || "#a8a29a"),
            borderWidth: 0,
            borderRadius: 4,
          }]
        },
        options: defaultChartOptions({ plugins: { ...defaultChartOptions().plugins, legend: { display: false } } })
      });
    }

    function renderDomainCreditsChart() {
      const domains = getDomainList();
      const credits = domains.map(domain => {
        return coursesData
          .filter(course => isPassed(course.grade) && getCourseDomain(course) === domain)
          .reduce((sum, course) => sum + Number(course.credits || 0), 0);
      });

      createChart("domainCreditsChart", {
        type: "bar",
        data: {
          labels: domains,
          datasets: [{
            label: "學分",
            data: credits,
            backgroundColor: domains.map((_, i) => palette.domain[i % palette.domain.length]),
            borderWidth: 0,
            borderRadius: 4,
          }]
        },
        options: defaultChartOptions({
          indexAxis: "y",
          plugins: { ...defaultChartOptions().plugins, legend: { display: false } }
        })
      });
    }

    function renderEarnedCreditsChart() {
      const stats = getSemesterStats();
      createChart("earnedCreditsChart", {
        type: "bar",
        data: {
          labels: stats.map(s => s.semester),
          datasets: [{
            label: "通過學分",
            data: stats.map(s => s.earnedCredits),
            backgroundColor: palette.accent,
            borderWidth: 0,
            borderRadius: 4,
          }]
        },
        options: defaultChartOptions({ plugins: { ...defaultChartOptions().plugins, legend: { display: false } } })
      });
    }

    function renderGpaCreditsChart() {
      const stats = getSemesterStats();
      createChart("gpaCreditsChart", {
        type: "bar",
        data: {
          labels: stats.map(s => s.semester),
          datasets: [{
            label: "GPA 計入學分",
            data: stats.map(s => s.gpaCredits),
            backgroundColor: "#6e8273",
            borderWidth: 0,
            borderRadius: 4,
          }]
        },
        options: defaultChartOptions({ plugins: { ...defaultChartOptions().plugins, legend: { display: false } } })
      });
    }

    function renderProgramNav() {
      const container = document.getElementById("program-nav");
      container.innerHTML = `
        <p class="nav-section-title">Programs</p>
        ${Object.keys(generatedReports).map(key => `
          <a class="nav-link" href="#program=${encodeURIComponent(key)}" data-program="${escapeHTML(key)}">
            ${escapeHTML(generatedReports[key].name)}
            <small>${escapeHTML(generatedReports[key].year)}</small>
          </a>
        `).join("")}
      `;
    }

    function safeQuerySelector(selector) {
      try { return document.querySelector(selector); } catch (_) { return null; }
    }

    function updateActiveNav(route, programKey = "") {
      document.querySelectorAll(".nav-link").forEach(link => link.classList.remove("is-active"));

      if (programKey) {
        const target = safeQuerySelector(`.nav-link[data-program="${CSS.escape(programKey)}"]`);
        target?.classList.add("is-active");
        return;
      }

      const target = safeQuerySelector(`.nav-link[data-route="${CSS.escape(route)}"]`);
      target?.classList.add("is-active");
    }

    function route() {
      const hash = window.location.hash.replace(/^#/, "") || "overview";
      if (hash.startsWith("program=")) {
        const programKey = decodeURIComponent(hash.slice("program=".length));
        document.getElementById("page-title").textContent = generatedReports[programKey]?.name || "學程查核";
        updateActiveNav("", programKey);
        renderProgramView(programKey);
        return;
      }

      const routeName = pageTitles[hash] ? hash : "overview";
      document.getElementById("page-title").textContent = pageTitles[routeName];
      updateActiveNav(routeName);

      if (routeName === "overview") renderOverview();
      else if (routeName === "courses") renderCoursesView();
      else if (routeName === "analytics") renderAnalyticsView();
    }

    function bindEvents() {
      window.addEventListener("hashchange", route);
      document.getElementById("refresh-btn").addEventListener("click", () => init());

      document.addEventListener("input", event => {
        const key = event.target?.dataset?.filter;
        if (!key) return;
        activeFilters[key] = event.target.value;
        renderCoursesView();
      });

      document.addEventListener("change", event => {
        const key = event.target?.dataset?.filter;
        if (!key) return;
        activeFilters[key] = event.target.value;
        renderCoursesView();
      });

      document.addEventListener("click", event => {
        const sortButton = event.target.closest("[data-sort]");
        if (!sortButton) return;

        const key = sortButton.dataset.sort;
        if (currentSort.key === key) {
          currentSort.direction = currentSort.direction === "asc" ? "desc" : "asc";
        } else {
          currentSort.key = key;
          currentSort.direction = "desc";
        }

        renderCoursesView();
      });
    }

    async function init() {
      const loading = document.getElementById("loading");
      const app = document.getElementById("app");
      const status = document.getElementById("data-status");

      loading.hidden = false;

      try {
        const [programRes, coursesRes] = await Promise.all([
          fetch("program.json", { cache: "no-store" }),
          fetch("courses.json", { cache: "no-store" })
        ]);

        if (!programRes.ok) throw new Error("無法取得 program.json");
        if (!coursesRes.ok) throw new Error("無法取得 courses.json");

        const rawProgram = await programRes.json();
        const rawCourses = await coursesRes.json();

        coursesData = rawCourses.courses || [];
        rulesData = rawProgram.programs || rawProgram;

        runGlobalAudit();
        renderProgramNav();

        document.getElementById("data-foot").textContent = `${coursesData.length} courses`;
        status.textContent = "Ready";

        loading.hidden = true;
        app.classList.remove("hidden");
        route();
      } catch (error) {
        loading.innerHTML = `<div class="error-box">${escapeHTML(error.message || error)}</div>`;
      }
    }

    bindEvents();
    init();
  </script>
</body>
</html>
